<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店赢OS 2.0 — 管理后台</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
:root{--primary:#1E3A5F;--gold:#F59E0B;--green:#10B981;--red:#EF4444;--sidebar-w:230px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5}
#app{height:100vh;display:flex}

/* Sidebar */
.sb{width:var(--sidebar-w);background:linear-gradient(180deg,#0a1628 0%,#1E3A5F 100%);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-logo h1{font-size:18px;font-weight:700;color:#fff}.sb-logo span{color:var(--gold)}
.sb-logo small{display:block;font-size:10px;color:#94a3b8;margin-top:2px}
.sb-mg{padding:14px 20px 4px;font-size:10px;letter-spacing:1px;color:#64748b;font-weight:600;text-transform:uppercase}
.sb-mi{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .2s;font-size:13px;border-left:3px solid transparent;text-decoration:none}
.sb-mi:hover{color:#fff;background:rgba(255,255,255,.05)}
.sb-mi.ac{color:var(--gold);background:rgba(245,158,11,.1);border-left-color:var(--gold);font-weight:600}
.sb-mi .badge{background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:auto}
.sb-ft{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#64748b}

/* Main */
.mn{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}
.tb{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 4px rgba(0,0,0,.05);z-index:10}
.tb-l{font-size:16px;font-weight:600;color:#1E3A5F;display:flex;align-items:center;gap:12px}
.tb-r{display:flex;align-items:center;gap:16px;font-size:13px}
.content{padding:20px;flex:1;overflow-y:auto;background:#f0f2f5}

/* Stats */
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.sc-i{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}
.sc-i .sc-t{font-size:13px;color:#999}.sc-i .sc-v{font-size:26px;font-weight:700;color:#1E3A5F;margin:4px 0}.sc-i .sc-s{font-size:11px;color:#999}
.sc-i .sc-ico{font-size:32px;opacity:.15}

/* Cards */
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;color:#1E3A5F;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:3px;height:16px;background:var(--gold);border-radius:2px;display:inline-block}

/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1628 0%,#1E3A5F 60%,#0a1628 100%)}
.login-box{width:400px;background:#fff;border-radius:14px;padding:44px 36px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.login-box h2{text-align:center;color:#1E3A5F;font-size:26px;margin-bottom:4px}
.login-box .sub{text-align:center;color:#999;font-size:13px;margin-bottom:28px}
.login-box .q-login{display:flex;gap:10px;margin-top:16px;justify-content:center}
.login-box .q-btn{flex:1;padding:10px;border:1px solid #e5e7eb;border-radius:8px;text-align:center;font-size:12px;cursor:pointer;transition:.2s;background:#fff;color:#666}
.login-box .q-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(245,158,11,.04)}

/* Misc */
.tag-a{color:var(--green)}.tag-d{color:var(--red)}.tag-w{color:var(--gold)}
.text-gold{color:var(--gold)}.text-green{color:var(--green)}.text-red{color:var(--red)}
.el-table tr{cursor:pointer}
.trust-lv{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-weight:800;font-size:14px}
.trust-a{background:#d1fae5;color:#065f46}.trust-b{background:#dbeafe;color:#1e40af}
.trust-c{background:#fef3c7;color:#92400e}.trust-d{background:#ffedd5;color:#9a3412}
.trust-e{background:#fee2e2;color:#991b1b}
.chart-box{width:100%;height:320px}
</style>
</head>
<body>
<div id="app"><router-view></router-view></div>
<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick, shallowRef, toRaw } = Vue
const { createRouter, createWebHashHistory } = VueRouter
const { ElMessage, ElMessageBox, ElNotification } = ElementPlus

// ======================== API 层 ========================
const TOKEN_KEY = 'dyos_admin_token'
const USER_KEY = 'dyos_admin_user'
let _token = localStorage.getItem(TOKEN_KEY) || ''
let _user = (()=>{try{return JSON.parse(localStorage.getItem(USER_KEY))||{}}catch(e){return{}}})()
const http = axios.create({baseURL:'/api/admin',timeout:15000})
http.interceptors.request.use(c=>{
  if(_token){c.headers.Authorization='Bearer '+_token}
  return c
})
http.interceptors.response.use(r=>{
  const d=r.data
  if(d&&d.code===0)return d.data!==undefined?d.data:d
  throw new Error((d&&d.message)||'请求失败')
},err=>{
  if(err.response&&err.response.status===401){logout();ElMessage.error('登录已过期')}
  return Promise.reject(err)
})
function setAuth(token,user){
  _token=token;_user=user
  localStorage.setItem(TOKEN_KEY,token)
  localStorage.setItem(USER_KEY,JSON.stringify(user))
}
function logout(){
  _token='';_user={}
  localStorage.removeItem(TOKEN_KEY)
  localStorage.removeItem(USER_KEY)
}

// ======================== 登录页 ========================
const LoginPage = {
  template:`
<div class="login-wrap">
  <div class="login-box">
    <h2>店赢<span style="color:var(--gold)">OS</span></h2>
    <p class="sub">AI透视门店运营，驱动流量·星级·营收全面增长</p>
    <el-form :model="f" ref="fr" @submit.prevent="login">
      <el-form-item prop="username"><el-input v-model="f.username" placeholder="用户名" size="large" prefix-icon="User" /></el-form-item>
      <el-form-item prop="password"><el-input v-model="f.password" type="password" placeholder="密码" size="large" prefix-icon="Lock" show-password @keyup.enter="login" /></el-form-item>
      <el-button type="primary" size="large" @click="login" :loading="loading" style="width:100%;background:var(--primary);border-color:var(--primary)">登 录</el-button>
    </el-form>
    <div class="q-login">
      <button class="q-btn" @click="ql('admin')">管理员 admin</button>
      <button class="q-btn" @click="ql('operator')">代理商 operator</button>
      <button class="q-btn" @click="ql('owner')">商户 owner</button>
    </div>
  </div>
</div>`,
  setup(){
    const f=reactive({username:'',password:''})
    const loading=ref(false)
    const router=VueRouter.useRouter()
    const login=async()=>{
      if(!f.username||!f.password){ElMessage.warning('请输入用户名和密码');return}
      loading.value=true
      try{
        const r=await axios.post('/api/login',{username:f.username,password:f.password})
        const d=r.data
        if(d.code===0&&d.data&&d.data.token){
          const u=d.data.user,role=u.role
          const ks={admin:'dyos_admin',agent:'dyos_agent',merchant:'dyos_merchant'}
          const k=ks[role]||'dyos_admin'
          localStorage.setItem(k+'_token',d.data.token)
          localStorage.setItem(k+'_user',JSON.stringify(u))
          setAuth(d.data.token,u)
          const pages={admin:'/dashboard',agent:'/dashboard',merchant:'/dashboard'}
          router.push(pages[role]||'/dashboard')
          ElMessage.success('登录成功')
        }else{ElMessage.error(d.message||'登录失败')}
      }catch(e){ElMessage.error(e.message||'登录失败')}
      finally{loading.value=false}
    }
    const ql=(r)=>{f.username=r;f.password='123456';login()}
    return {f,loading,login,ql}
  }
}

// ======================== 主布局 ========================
const MainLayout = {
  template:`
<div id="app">
  <div class="sb">
    <div class="sb-logo" @click="$router.push('/dashboard')">
      <div style="width:32px;height:32px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#000">OS</div>
      <div><h1>店赢<span>OS</span></h1><small>AI智能门店运营平台</small></div>
    </div>
    <template v-for="g in menuGroups" :key="g.name">
      <div class="sb-mg">{{g.name}}</div>
      <router-link v-for="m in g.items" :key="m.key" :to="m.key" class="sb-mi" :class="{ac:$route.path===m.key}">
        <el-icon><component :is="m.icon"/></el-icon>{{m.label}}
        <span class="badge" v-if="m.badge">{{m.badge}}</span>
      </router-link>
    </template>
    <div class="sb-ft">API v2.0 · Go · Alive</div>
  </div>
  <div class="mn">
    <div class="tb">
      <div class="tb-l">{{pageTitle}}</div>
      <div class="tb-r">
        <el-tag :type="roleTag" size="small" effect="dark">{{_user.name||_user.username||'管理员'}}</el-tag>
        <el-button text size="small" @click="doLogout">退出</el-button>
      </div>
    </div>
    <div class="content"><router-view></router-view></div>
  </div>
</div>`,
  setup(){
    const route=VueRouter.useRoute();const router=VueRouter.useRouter()
    const menuGroups=[
      {name:'核心看板',items:[
        {key:'/dashboard',label:'数据大屏',icon:'Odometer'},
        {key:'/reviews',label:'评价管理',icon:'ChatDotRound'},
        {key:'/complaints',label:'投诉处理',icon:'WarningFilled'},
      ]},
      {name:'业务管理',items:[
        {key:'/merchants',label:'商户管理',icon:'Shop'},
        {key:'/agents',label:'代理商管理',icon:'UserFilled'},
        {key:'/sales',label:'业务员管理',icon:'Avatar'},
        {key:'/members',label:'会员管理',icon:'Stamp'},
      ]},
      {name:'AI能力',items:[
        {key:'/ai-agents',label:'AI Agent',icon:'Cpu'},
        {key:'/content',label:'内容生成',icon:'EditPen'},
        {key:'/knowledge',label:'知识库',icon:'Collection'},
        {key:'/ai-chat',label:'AI客服',icon:'Service',badge:'30s回复'},
	      {key:'/smart-pricing',label:'智能定价',icon:'TrendCharts'},
      ]},
      {name:'财务支付',items:[
        {key:'/finance',label:'财务中心',icon:'Money'},
        {key:'/tianque',label:'天阙支付',icon:'CreditCard'},
        {key:'/payment-providers',label:'支付服务商',icon:'Wallet'},
        {key:'/risk-merchants',label:'风险商户',icon:'Warning'},
      ]},
      {name:'数据分析',items:[
        {key:'/sentiment',label:'舆情管控',icon:'Bell'},
        {key:'/reports',label:'报表中心',icon:'Document'},
        {key:'/insights',label:'AI洞察',icon:'DataAnalysis'},
      ]},
      {name:'系统设置',items:[
        {key:'/settings',label:'系统设置',icon:'Setting'},
        {key:'/platform',label:'平台适配',icon:'Connection'},
      ]}
    ]
    const pageTitle=computed(()=>{
      for(const g of menuGroups){for(const m of g.items){if(m.key===route.path)return m.label}}
      return '店赢OS 管理后台'
    })
    const roleTag=computed(()=>{
      const r=_user.role;if(r==='admin')return'';
      return r==='agent'?'warning':'success'
    })
    const doLogout=()=>{
      const ks={admin:'dyos_admin',agent:'dyos_agent',merchant:'dyos_merchant'}
      const k=ks[_user.role]||'dyos_admin'
      localStorage.removeItem(k+'_token');localStorage.removeItem(k+'_user')
      logout();router.push('/login')
    }
    onMounted(()=>{if(!_token){router.push('/login')}})
    return {menuGroups,pageTitle,roleTag,doLogout,_user}
  }
}

// ======================== 数据大屏 ========================
const Dashboard = {
  template:`
<div>
  <!-- KPI 卡片 -->
  <div class="sc">
    <div class="sc-i" v-for="s in cards" :key="s.label">
      <div><div class="sc-t">{{s.label}}</div><div class="sc-v" :style="{color:s.color||'#1E3A5F'}">{{s.value}}</div><div class="sc-s">{{s.sub}}</div></div>
      <div class="sc-ico"><el-icon :size="32"><component :is="s.icon"/></el-icon></div>
    </div>
  </div>

  <!-- 图表行 -->
  <div class="g2">
    <div class="card"><h3>今日GMV 分时趋势</h3><div class="chart-box" ref="hourlyChart"></div></div>
    <div class="card"><h3>行业分布</h3><div class="chart-box" ref="industryChart"></div></div>
  </div>

  <!-- Agent 管线 + 实时预警 -->
  <div class="g2" style="margin-top:16px">
    <div class="card"><h3>AI Agent 运行状态</h3>
      <div v-for="a in agents" :key="a.name" style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5">
        <el-icon :size="18" :style="{color:a.status==='running'?'var(--green)':'#ccc',marginRight:'10px'}"><component :is="a.icon"/></el-icon>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">{{a.name}}</div><el-progress :percentage="a.progress" :stroke-width="6" :color="a.status==='running'?'#10B981':'#F59E0B'" :duration="3" :indeterminate="false"/></div>
        <span style="font-size:11px;color:#999;margin-left:12px">{{a.tasks}}任务</span>
        <el-tag :type="a.status==='running'?'success':'warning'" size="small" style="margin-left:8px">{{a.status==='running'?'运行中':'空闲'}}</el-tag>
      </div>
    </div>
    <div class="card"><h3>实时预警 ({{alerts.length}})</h3>
      <div v-for="a in alerts.slice(0,6)" :key="a.id" style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5">
        <el-tag :type="a.level==='error'?'danger':'warning'" size="small" style="margin-top:2px;flex-shrink:0">{{a.level==='error'?'紧急':'预警'}}</el-tag>
        <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{a.title}}</div><div style="font-size:11px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{a.content}}</div></div>
        <span style="font-size:11px;color:#999;flex-shrink:0">{{a.time}}</span>
      </div>
      <div v-if="!alerts.length" style="text-align:center;color:#999;padding:20px">暂无预警</div>
    </div>
  </div>

  <!-- 实时订单 + 平台统计 -->
  <div class="g2" style="margin-top:16px">
    <div class="card"><h3>实时订单流水</h3>
      <el-table :data="orders.slice(0,8)" size="small"><el-table-column prop="id" label="订单号" width="140"/><el-table-column prop="merchant" label="商户" min-width="120"/><el-table-column prop="amount" label="金额" width="80"><template #def="s"><span class="text-gold" style="font-weight:600">¥{{s.row.amount}}</span></template></el-table-column><el-table-column prop="status" label="状态" width="80"><template #def="s"><el-tag :type="s.row.status==='success'||s.row.status==='COMPLETED'?'success':s.row.status==='REFUNDED'?'info':'warning'" size="small">{{s.row.status==='success'||s.row.status==='COMPLETED'?'成功':s.row.status==='REFUNDED'?'退款':s.row.status}}</el-tag></template></el-table-column><el-table-column prop="time" label="时间" width="140"/></el-table>
      <div v-if="!orders.length" style="text-align:center;color:#999;padding:20px">暂无订单</div>
    </div>
    <div class="card"><h3>平台评价统计</h3>
      <div v-if="!platforms.length" style="text-align:center;color:#999;padding:40px">暂无平台数据</div>
      <el-table v-else :data="platforms" size="small"><el-table-column prop="platform" label="平台" min-width="100"/><el-table-column prop="count" label="评价数" width="80"/><el-table-column prop="avg" label="均分" width="70"/></el-table>
    </div>
  </div>
</div>`,
  setup(){
    const cards=reactive([
      {label:'商户总数',value:'--',sub:'加载中',icon:'Shop',color:'#1E3A5F'},
      {label:'今日GMV',value:'--',sub:'加载中',icon:'Money',color:'#F59E0B'},
      {label:'今日订单',value:'--',sub:'加载中',icon:'Document',color:'#10B981'},
      {label:'支付成功率',value:'--',sub:'加载中',icon:'CreditCard',color:'#6366F1'},
      {label:'待处理预警',value:'--',sub:'加载中',icon:'Warning',color:'#EF4444'},
      {label:'AI调用次数',value:'--',sub:'加载中',icon:'Cpu',color:'#8B5CF6'},
    ])
    const agents=ref([]), alerts=ref([]), orders=ref([]), platforms=ref([])
    const hourlyChart=ref(null), industryChart=ref(null)
    let hc=null,ic=null

    const loadData = async () => {
      try{
        const snap = await http.get('/screen/snapshot')
        const k = snap.kpis || {}
        cards[0].value = (k.total_merchants||0).toLocaleString()
        cards[0].sub = '在线'+(k.online_merchants||0)+'家'
        cards[1].value = '¥'+(k.today_amount||0).toLocaleString()
        cards[1].sub = '累计GMV ¥'+(k.total_gmv||0).toLocaleString()
        cards[2].value = (k.today_orders||0).toString()
        cards[2].sub = '评价均分 '+(k.avg_rating||0)+'分'
        cards[3].value = (k.pay_success_rate||0).toFixed(0)+'%'
        cards[3].sub = '共'+(k.total_reviews||0)+'条评价'
        cards[4].value = (k.alerts||0).toString()
        cards[4].sub = '投诉+差评预警'
        cards[5].value = (k.ai_calls||0).toLocaleString()
        cards[5].sub = 'Multi-Agent协同'
        agents.value = snap.agents || []
        alerts.value = snap.alerts || []
        orders.value = snap.orders || []
        platforms.value = snap.platforms || []
        // 行业分布图表
        const inds = snap.industries || []
        if(ic && inds.length){
          ic.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['45%','72%'],avoidLabelOverlap:false,label:{show:false},emphasis:{label:{show:true,fontSize:16}},data:inds.map(x=>({value:x.count,name:x.name}))}]})
        }
        // 分时趋势图表
        const hourly = snap.hourly || []
        if(hc && hourly.length){
          hc.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:hourly.map(h=>h.hour+'时')},yAxis:{type:'value',name:'GMV(¥)'},series:[{type:'bar',data:hourly.map(h=>h.amount),itemStyle:{color:'#F59E0B',borderRadius:[4,4,0,0]}}]})
        }
      }catch(e){
        // 降级：逐个加载
        try{const k=await http.get('/screen/kpis')
          cards[0].value=(k.total_merchants||0).toLocaleString();cards[0].sub='在线'+(k.online_merchants||0)+'家'
          cards[1].value='¥'+(k.today_amount||0).toLocaleString();cards[1].sub='累计GMV ¥'+(k.total_gmv||0).toLocaleString()
          cards[2].value=(k.today_orders||0).toString();cards[2].sub='评价均分'+(k.avg_rating||0)+'分'
          cards[3].value=(k.pay_success_rate||0).toFixed(0)+'%';cards[3].sub='共'+(k.total_reviews||0)+'条评价'
          cards[4].value=(k.alerts||0).toString();cards[4].sub='投诉+差评预警'
          cards[5].value=(k.ai_calls||0).toLocaleString();cards[5].sub='Multi-Agent协同'
        }catch(e2){}
        try{agents.value=await http.get('/screen/agents')}catch(e2){}
        try{alerts.value=(await http.get('/screen/alerts')).items||[]}catch(e2){}
        try{orders.value=(await http.get('/screen/orders',{params:{limit:20}})).items||[]}catch(e2){}
        try{platforms.value=(await http.get('/screen/platforms')).items||[]}catch(e2){}
        try{
          const inds=(await http.get('/screen/industries')).items||[]
          if(ic&&inds.length){ic.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['45%','72%'],data:inds.map(x=>({value:x.count,name:x.name}))}]})}
        }catch(e2){}
        try{
          const hr=(await http.get('/screen/hourly')).items||[]
          if(hc&&hr.length){hc.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:hr.map(h=>h.hour+'时')},yAxis:{type:'value',name:'GMV(¥)'},series:[{type:'bar',data:hr.map(h=>h.amount),itemStyle:{color:'#F59E0B',borderRadius:[4,4,0,0]}}]})}
        }catch(e2){}
      }
    }

    onMounted(async()=>{
      await loadData()
      nextTick(()=>{
        if(hourlyChart.value){hc=echarts.init(hourlyChart.value);hc.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:[]},yAxis:{type:'value',name:'GMV(¥)'},series:[{type:'bar',data:[],itemStyle:{color:'#F59E0B'}}]})}
        if(industryChart.value){ic=echarts.init(industryChart.value);ic.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['45%','72%'],data:[]}]})}
        loadData()
      })
    })

    // 30秒自动刷新
    let timer = setInterval(loadData, 30000)
    onUnmounted(()=>clearInterval(timer))

    return {cards,agents,alerts,orders,platforms,hourlyChart,industryChart}
  }

  <div class="card" style="margin-top:16px">

    <div v-else class="g3">
      <div v-for="(sg,i) in suggestions" :key="i" style="padding:14px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0">

      </div>
    </div>
  </div>
</div>`,
  setup(){
    const items=ref([]),loading=ref(false),genLoading=ref(false)
    const kpis=reactive({total_merchants:0,online_merchants:0,pay_success_rate:0,avg_rating:0,total_reviews:0,alerts:0})
    const insights=ref([])
    const suggestions=ref([])

    const genReport=async()=>{
      genLoading.value=true
      try{
        // 获取实时数据生成洞察
        const snap=await http.get('/screen/snapshot')
        const k=snap.kpis||{}
        Object.assign(kpis,k)

        // 基于数据生成AI洞察
        const ins=[]
        if(k.alerts>3){ins.push({level:'warning',title:'预警数量偏高',detail:`当前有${k.alerts}条待处理预警，建议优先处理投诉类预警，避免影响门店评分。建议启动快速响应流程。`})}
        if(k.pay_success_rate<90){ins.push({level:'warning',title:'支付成功率低于基准',detail:`当前支付成功率${(k.pay_success_rate||0).toFixed(0)}%，低于90%基准线。建议检查支付通道状态和网络稳定性。`})}
        if(k.avg_rating<3.5){ins.push({level:'info',title:'评价均分需提升',detail:`当前均分${k.avg_rating||0}分，建议分析差评关键词，针对性改善服务质量。AI可辅助生成回复话术。`})}
        if(k.online_merchants===k.total_merchants){ins.push({level:'success',title:'商户在线率100%',detail:`${k.total_merchants}家商户全部在线，系统运行稳定。累计GMV ¥${(k.total_gmv||0).toLocaleString()}。`})}
        insights.value=ins

        // 生成运营建议
        const suggs=[]
        if(k.alerts>0){suggs.push({action:'优先处理投诉预警',reason:`共${k.alerts}条预警待处理，差评平均浏览500-2000次，及时回复可挽回潜在客户。`,impact:'减少差评曝光率30-50%'})}
        if(k.total_reviews>0){suggs.push({action:'启动AI批量回复',reason:`共${k.total_reviews}条评价，建议对未回复评价启动AI批量生成回复话术。`,impact:`预计提升回复率至95%+`})}
        suggs.push({action:'导出运营日报',reason:'将今日运营数据导出为日报，发送给相关决策人。',impact:'数据驱动决策，减少运营盲区'})
        suggestions.value=suggs

        // 保存到后端
        try{await http.post('/insights/daily-report',{kpis:k,insights:ins,suggestions:suggs})}catch(e){}
        ElMessage.success('AI洞察已生成')
        load()
      }catch(e){ElMessage.error('生成失败')}
      genLoading.value=false
    }
    const load=async()=>{
      loading.value=true
      try{const r=await http.get('/insights/daily-reports',{params:{page:1,size:10}});items.value=r.items||[]}catch(e){}
      loading.value=false
    }
    onMounted(async()=>{
      load()
      try{const k=await http.get('/screen/kpis');Object.assign(kpis,k)}catch(e){}
    })
    return {items,loading,genLoading,kpis,insights,suggestions,genReport,load}
  }
}

      form.id=0;form.platform='wechat_pay';form.provider_name='';form.mch_id='';form.mch_name='';form.app_id='';form.api_key='';form.serial_no='';form.private_key='';form.public_key='';form.platform_cert='';form.platform_cert_no='';form.webhook_secret='';form.merchant_no='';form.remark='';form.status='active'
    }
    const load=async()=>{loading.value=true;try{const r=await http.get('/payment-providers');items.value=r.items||r||[]}catch(e){ElMessage.error('加载失败: '+e.message)}finally{loading.value=false}}
    const openCreate=()=>{isEdit.value=false;resetForm();visible.value=true}
    const openEdit=(row)=>{isEdit.value=true;Object.assign(form,{...row,api_key:'',private_key:'',public_key:'',platform_cert:''});visible.value=true}
    const doSave=async()=>{
      if(!form.platform||!form.provider_name||!form.mch_id){ElMessage.warning('请填写平台、服务商名称和商户号');return}
      saving.value=true
      try{
        const payload={...form}
        if(isEdit.value){
          if(!payload.api_key)delete payload.api_key
          if(!payload.private_key)delete payload.private_key
          if(!payload.public_key)delete payload.public_key
          if(!payload.platform_cert)delete payload.platform_cert
          await http.put('/payment-providers/'+form.id,payload)
          ElMessage.success('更新成功')
        }else{
          await http.post('/payment-providers',payload)
          ElMessage.success('创建成功')
        }
        visible.value=false;load()
      }catch(e){ElMessage.error('保存失败: '+e.message)}finally{saving.value=false}
    }
    const doDelete=async(row)=>{try{await ElMessageBox.confirm('确认删除服务商 '+row.provider_name+' ?','确认',{type:'warning'});await http.delete('/payment-providers/'+row.id);ElMessage.success('已删除');load()}catch(e){if(e!=='cancel')ElMessage.error('删除失败: '+e.message)}}
    onMounted(load)
    return {items,loading,visible,isEdit,saving,form,openCreate,openEdit,doSave,doDelete}
  }
}

const RiskMerchants = {
  template:`
<div>
  <div class="sc">
    <div class="sc-i"><div><div class="sc-t">风险商户总数</div><div class="sc-v">{{stats.total||0}}</div><div class="sc-s">全平台统计</div></div><div class="sc-ico">⚠️</div></div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center">
        <el-select v-model="platform" placeholder="平台" style="width:130px" size="small" clearable @change="load">
          <el-option label="微信支付" value="wechat_pay"/><el-option label="支付宝" value="alipay"/>
        </el-select>
        <el-select v-model="riskLevel" placeholder="风险等级" style="width:110px" size="small" clearable @change="load">
          <el-option label="高风险" value="high"/><el-option label="中风险" value="medium"/><el-option label="低风险" value="low"/>
        </el-select>
        <el-select v-model="handleStatus" placeholder="处理状态" style="width:110px" size="small" clearable @change="load">
          <el-option label="待处理" value="pending"/><el-option label="处理中" value="processing"/><el-option label="已处理" value="resolved"/>
        </el-select>
      </div>
      <div style="display:flex;gap:8px">
        <el-button size="small" type="warning" @click="doSync" :loading="syncing">从投诉同步风险商户</el-button>
        <el-button size="small" type="primary" @click="load">刷新</el-button>
      </div>
    </div>
    <el-table :data="items" stripe v-loading="loading">
      <el-table-column prop="id" label="ID" width="60"/>
      <el-table-column prop="platform" label="平台" width="90">
        <template #def="s"><el-tag :type="s.row.platform==='wechat_pay'?'success':'primary'" size="small">{{s.row.platform==='wechat_pay'?'微信支付':'支付宝'}}</el-tag></template>
      </el-table-column>
      <el-table-column prop="mch_id" label="商户号" width="140"/>
      <el-table-column prop="mch_name" label="商户名称" width="110"/>
      <el-table-column prop="risk_type" label="风险类型" width="100"/>
      <el-table-column prop="risk_level" label="风险等级" width="90">
        <template #def="s"><el-tag :type="s.row.risk_level==='high'?'danger':s.row.risk_level==='medium'?'warning':'info'" size="small">{{s.row.risk_level==='high'?'高风险':s.row.risk_level==='medium'?'中风险':'低风险'}}</el-tag></template>
      </el-table-column>
      <el-table-column prop="risk_detail" label="风险详情" min-width="200" show-overflow-tooltip/>
      <el-table-column prop="complaint_count" label="投诉数" width="80"/>
      <el-table-column prop="complaint_rate" label="投诉率" width="80"><template #def="s">{{(s.row.complaint_rate||0).toFixed(1)}}%</template></el-table-column>
      <el-table-column prop="handle_status" label="处理状态" width="90">
        <template #def="s"><el-tag :type="s.row.handle_status==='pending'?'danger':s.row.handle_status==='processing'?'warning':'success'" size="small">{{s.row.handle_status==='pending'?'待处理':s.row.handle_status==='processing'?'处理中':'已处理'}}</el-tag></template>
      </el-table-column>
      <el-table-column prop="detected_at" label="检测时间" width="120"/>
      <el-table-column label="操作" width="130" fixed="right">
        <template #def="s">
          <el-button link size="small" type="primary" @click="openHandle(s.row)" v-if="s.row.handle_status!=='resolved'">处理</el-button>
          <span v-else style="color:#999;font-size:12px">已处理</span>
        </template>
      </el-table-column>
    </el-table>
    <div style="margin-top:14px;text-align:right"><el-pagination background layout="prev,pager,next,total" :total="total" :page-size="size" v-model:current-page="page" @current-change="load"/></div>
  </div>

  <el-dialog v-model="handleVisible" title="处理风险商户" width="500px">
    <div style="margin-bottom:16px">
      <p><strong>商户号：</strong>{{curItem?.mch_id}}</p>
      <p><strong>风险类型：</strong>{{curItem?.risk_type}}</p>
      <p><strong>风险等级：</strong>{{curItem?.risk_level==='high'?'高风险':curItem?.risk_level==='medium'?'中风险':'低风险'}}</p>
      <p><strong>详情：</strong>{{curItem?.risk_detail}}</p>
    </div>
    <el-form label-width="80px" size="small">
      <el-form-item label="处理方式" required>
        <el-select v-model="handleForm.action" style="width:100%">
          <el-option label="标记处理中" value="processing"/>
          <el-option label="已解决" value="resolved"/>
          <el-option label="关闭" value="closed"/>
        </el-select>
      </el-form-item>
      <el-form-item label="备注">
        <el-input v-model="handleForm.remark" type="textarea" :rows="3" placeholder="处理备注..."/>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="handleVisible=false">取消</el-button>
      <el-button type="primary" @click="doHandle" :loading="handling">确认处理</el-button>
    </template>
  </el-dialog>
</div>`,
  setup(){
    const items=ref([]),stats=reactive({total:0,pending:0,high:0,medium:0}),loading=ref(false),syncing=ref(false),handling=ref(false)
    const platform=ref(''),riskLevel=ref(''),handleStatus=ref(''),page=ref(1),size=ref(20),total=ref(0)
    const handleVisible=ref(false),curItem=ref(null)
    const handleForm=reactive({action:'processing',remark:''})

    const load=async()=>{
      loading.value=true
      try{
        const r=await http.get('/risk-merchants',{params:{platform:platform.value,risk_level:riskLevel.value,handle_status:handleStatus.value,page:page.value,size:size.value}})
        items.value=r.items||[];total.value=r.total||0
      }catch(e){ElMessage.error('加载失败: '+e.message)}finally{loading.value=false}
    }
    const loadStats=async()=>{
      try{const r=await http.get('/risk-merchants/stats');Object.assign(stats,r)}catch(e){}
    }
    const doSync=async()=>{
      syncing.value=true
      try{const r=await http.post('/risk-merchants/sync');ElMessage.success('同步完成，新增'+((r&&r.count)||0)+'条风险商户');load();loadStats()}catch(e){ElMessage.error('同步失败: '+e.message)}finally{syncing.value=false}
    }
    const openHandle=(row)=>{curItem.value=row;handleForm.action='processing';handleForm.remark='';handleVisible.value=true}
    const doHandle=async()=>{
      if(!curItem.value)return
      handling.value=true
      try{await http.post('/risk-merchants/'+curItem.value.id+'/handle',{action:handleForm.action,remark:handleForm.remark});ElMessage.success('处理成功');handleVisible.value=false;load();loadStats()}catch(e){ElMessage.error('处理失败: '+e.message)}finally{handling.value=false}
    }
    onMounted(()=>{load();loadStats()})
    return {items,stats,loading,syncing,handling,platform,riskLevel,handleStatus,page,size,total,handleVisible,curItem,handleForm,load,loadStats,doSync,openHandle,doHandle}
  }
}
