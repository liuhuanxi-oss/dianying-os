<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店赢OS — 代理商门户</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
:root{--primary:#1E3A5F;--gold:#F59E0B;--green:#10B981;--red:#EF4444;--sidebar-w:220px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5}
#app{height:100vh;display:flex}
.sb{width:var(--sidebar-w);background:linear-gradient(180deg,#0a1628,#1E3A5F);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-logo h1{font-size:17px;font-weight:700;color:#fff}.sb-logo span{color:var(--gold)}
.sb-logo small{display:block;font-size:10px;color:#94a3b8;margin-top:2px}
.sb-mg{padding:14px 20px 4px;font-size:10px;letter-spacing:1px;color:#64748b;font-weight:600;text-transform:uppercase}
.sb-mi{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .2s;font-size:13px;border-left:3px solid transparent;text-decoration:none}
.sb-mi:hover{color:#fff;background:rgba(255,255,255,.05)}
.sb-mi.ac{color:var(--gold);background:rgba(245,158,11,.1);border-left-color:var(--gold);font-weight:600}
.sb-ft{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#64748b}
.mn{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}
.tb{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 4px rgba(0,0,0,.05);z-index:10}
.tb-l{font-size:16px;font-weight:600;color:#1E3A5F}
.tb-r{display:flex;align-items:center;gap:16px;font-size:13px}
.content{padding:20px;flex:1;overflow-y:auto;background:#f0f2f5}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.sc-i{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}
.sc-i .sc-t{font-size:13px;color:#999}.sc-i .sc-v{font-size:26px;font-weight:700;color:#1E3A5F;margin:4px 0}.sc-i .sc-s{font-size:11px;color:#999}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;color:#1E3A5F;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:3px;height:16px;background:var(--gold);border-radius:2px;display:inline-block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{width:100%;height:300px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1628,#1E3A5F 60%,#0a1628)}
.login-box{width:400px;background:#fff;border-radius:14px;padding:44px 36px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.login-box h2{text-align:center;color:#1E3A5F;font-size:26px;margin-bottom:4px}
.login-box .sub{text-align:center;color:#999;font-size:13px;margin-bottom:28px}
.text-gold{color:var(--gold)}.text-green{color:var(--green)}.text-red{color:var(--red)}
.trust-lv{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-weight:800;font-size:14px}
.trust-a{background:#d1fae5;color:#065f46}.trust-b{background:#dbeafe;color:#1e40af}
.trust-c{background:#fef3c7;color:#92400e}.trust-d{background:#ffedd5;color:#9a3412}
.trust-e{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div id="app"><router-view></router-view></div>
<script>
const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue
const { createRouter, createWebHashHistory } = VueRouter
const { ElMessage, ElMessageBox } = ElementPlus

const TOKEN_KEY = 'dyos_agent_token'
const USER_KEY = 'dyos_agent_user'
let _token = localStorage.getItem(TOKEN_KEY) || ''
let _user = (()=>{try{return JSON.parse(localStorage.getItem(USER_KEY))||{}}catch(e){return{}}})()

const http = axios.create({baseURL:'/api/admin',timeout:15000})
http.interceptors.request.use(c=>{
  if(_token){c.headers.Authorization='Bearer '+_token}
  return c
})
http.interceptors.response.use(r=>{
  const d=r.data
  if(d&&d.code===0)return d.data!==undefined?d.data:d
  throw new Error((d&&d.message)||'请求失败')
},err=>{
  if(err.response&&err.response.status===401){doLogout();ElMessage.error('登录已过期')}
  return Promise.reject(err)
})
function setAuth(token,user){
  _token=token;_user=user
  localStorage.setItem(TOKEN_KEY,token)
  localStorage.setItem(USER_KEY,JSON.stringify(user))
}
function doLogout(){
  _token='';_user={}
  localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY)
}

// ======================== 登录 ========================
const LoginPage = {
  template:`
<div class="login-wrap"><div class="login-box">
  <h2>店赢<span style="color:var(--gold)">OS</span></h2>
  <p class="sub">代理商门户 — AI智能门店运营平台</p>
  <el-form :model="f" @submit.prevent="login">
    <el-form-item><el-input v-model="f.username" placeholder="代理商账号" size="large" prefix-icon="User" @keyup.enter="login"/></el-form-item>
    <el-form-item><el-input v-model="f.password" type="password" placeholder="密码" size="large" prefix-icon="Lock" show-password @keyup.enter="login"/></el-form-item>
    <el-button type="primary" size="large" @click="login" :loading="loading" style="width:100%;background:var(--primary);border-color:var(--primary)">登 录</el-button>
  </el-form>
  <div style="text-align:center;margin-top:12px"><el-button size="small" text @click="ql('agent')">快速登录</el-button></div>
</div></div>`,
  setup(){
    const f=reactive({username:'',password:''}),loading=ref(false)
    const router=VueRouter.useRouter()
    const login=async()=>{
      if(!f.username||!f.password){ElMessage.warning('请输入账号和密码');return}
      loading.value=true
      try{
        const r=await axios.post('/api/login',{username:f.username,password:f.password})
        const d=r.data
        if(d.code===0&&d.data&&d.data.token){
          const u=d.data.user
          if(u.role!=='agent'){ElMessage.error('此账号非代理商账号');return}
          setAuth(d.data.token,u);router.push('/dashboard');ElMessage.success('登录成功')
        }else{ElMessage.error(d.message||'登录失败')}
      }catch(e){ElMessage.error(e.message||'登录失败')}
      finally{loading.value=false}
    }
    const ql=(r)=>{f.username=r;f.password='123456';login()}
    return {f,loading,login,ql}
  }
}

// ======================== 主布局 ========================
const MainLayout = {
  template:`
<div id="app"><div class="sb">
  <div class="sb-logo" @click="$router.push('/dashboard')">
    <div style="width:32px;height:32px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#000">OS</div>
    <div><h1>店赢<span>OS</span></h1><small>代理商门户</small></div>
  </div>
  <div class="sb-mg">工作台</div>
  <router-link v-for="m in menuGroups[0].items" :key="m.key" :to="m.key" class="sb-mi" :class="{ac:$route.path===m.key}"><el-icon><component :is="m.icon"/></el-icon>{{m.label}}</router-link>
  <div class="sb-mg">业务管理</div>
  <router-link v-for="m in menuGroups[1].items" :key="m.key" :to="m.key" class="sb-mi" :class="{ac:$route.path===m.key}"><el-icon><component :is="m.icon"/></el-icon>{{m.label}}</router-link>
  <div class="sb-mg">财务</div>
  <router-link v-for="m in menuGroups[2].items" :key="m.key" :to="m.key" class="sb-mi" :class="{ac:$route.path===m.key}"><el-icon><component :is="m.icon"/></el-icon>{{m.label}}</router-link>
  <div class="sb-ft">{{_user.name||'代理商'}} · Go v2.0</div>
</div>
<div class="mn"><div class="tb"><div class="tb-l">{{pageTitle}}</div><div class="tb-r"><el-tag type="warning" size="small" effect="dark">{{_user.name||'代理商'}}</el-tag><el-button text size="small" @click="logout">退出</el-button></div></div>
<div class="content"><router-view></router-view></div></div></div>`,
  setup(){
    const route=VueRouter.useRoute();const router=VueRouter.useRouter()
    const menuGroups=[
      {name:'工作台',items:[
        {key:'/dashboard',label:'数据概览',icon:'Odometer'},
        {key:'/reviews',label:'评价管理',icon:'ChatDotRound'},
      ]},
      {name:'业务管理',items:[
        {key:'/merchants',label:'下属商户',icon:'Shop'},
        {key:'/sales',label:'业务员管理',icon:'Avatar'},
        {key:'/members',label:'会员管理',icon:'Stamp'},
      ]},
      {name:'财务',items:[
        {key:'/commission',label:'佣金结算',icon:'Money'},
        {key:'/finance',label:'财务中心',icon:'CreditCard'},
      ]}
    ]
    const pageTitle=computed(()=>{
      for(const g of menuGroups){const m=g.items.find(m=>m.key===route.path);if(m)return m.label}
      return '代理商门户'
    })
    const logout=()=>{doLogout();router.push('/login')}
    onMounted(()=>{if(!_token){router.push('/login')}})
    return {menuGroups,pageTitle,logout,_user}
  }
}

// ======================== 数据概览 ========================
const Dashboard = {
  template:`
<div>
  <div class="sc">
    <div class="sc-i"><div><div class="sc-t">下属商户</div><div class="sc-v">{{stats.merchant_count||0}}</div><div class="sc-s">活跃{{stats.active_merchants||0}}家</div></div></div>
    <div class="sc-i"><div><div class="sc-t">月GMV</div><div class="sc-v text-gold">{{fmt(stats.monthly_gmv||0)}}</div><div class="sc-s">环比+{{stats.gmv_change||'--'}}%</div></div></div>
    <div class="sc-i"><div><div class="sc-t">待结算佣金</div><div class="sc-v text-green">{{fmt(stats.commission||0)}}</div><div class="sc-s">{{stats.pending_count||0}}笔</div></div></div>
    <div class="sc-i"><div><div class="sc-t">累计收益</div><div class="sc-v text-gold">{{fmt(stats.total_earnings||0)}}</div><div class="sc-s">历史累计</div></div></div>
  </div>
  <div class="g2">
    <div class="card"><h3>GMV趋势 (近7日)</h3><div class="chart-box" ref="c1"></div></div>
    <div class="card"><h3>商户行业分布</h3><div class="chart-box" ref="c2"></div></div>
  </div>
  <div class="card"><h3>最新入驻商户</h3>
    <el-table :data="merchants" stripe size="small">
      <el-table-column prop="name" label="商户名称" min-width="140"/><el-table-column prop="industry" label="行业" width="100"/>
      <el-table-column prop="status" label="状态" width="90"><template #def="s"><el-tag :type="s.row.status==='APPROVED'?'success':'warning'" size="small">{{s.row.status==='APPROVED'?'已审核':s.row.status}}</el-tag></template></el-table-column>
      <el-table-column prop="create_time" label="入驻时间" width="110"/>
    </el-table>
  </div>
</div>`,
  setup(){
    const stats=reactive({merchant_count:0,active_merchants:0,monthly_gmv:0,gmv_change:0,commission:0,pending_count:0,total_earnings:0})
    const merchants=ref([]),c1=ref(null),c2=ref(null)
    const fmt=v=>v>=10000?'¥'+(v/10000).toFixed(1)+'万':'¥'+(v||0).toLocaleString()
    onMounted(async()=>{
      try{const r=await http.get('/agents/dashboard');Object.assign(stats,r)}catch(e){}
      try{const r=await http.get('/merchants/',{params:{page:1,size:8}});merchants.value=r.items||[]}catch(e){}
      nextTick(()=>{
        if(c1.value){const ch=echarts.init(c1.value);ch.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:['5/21','5/22','5/23','5/24','5/25','5/26','5/27']},yAxis:{type:'value'},series:[{type:'line',data:[28500,31200,29800,35600,33200,38900,40200],smooth:true,areaStyle:{opacity:.15},lineStyle:{color:'#F59E0B'},itemStyle:{color:'#F59E0B'}}]})}
        if(c2.value){const ch=echarts.init(c2.value);ch.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['45%','72%'],label:{show:false},data:[{value:320,name:'餐饮'},{value:180,name:'零售'},{value:95,name:'休闲娱乐'},{value:62,name:'商业服务'},{value:45,name:'酒旅景区'}]}]})}
      })
    })
    return {stats,merchants,c1,c2,fmt}
  }
}

// ======================== 评价管理 ========================
const Reviews = {
  template:`
<div>
  <div class="sc">
    <div class="sc-i"><div><div class="sc-t">总评价数</div><div class="sc-v">{{stats.total||0}}</div><div class="sc-s">下属商户累计</div></div></div>
    <div class="sc-i"><div><div class="sc-t">好评率</div><div class="sc-v text-green">{{stats.good_rate||'--'}}%</div></div></div>
    <div class="sc-i"><div><div class="sc-t">差评率</div><div class="sc-v text-red">{{stats.bad_rate||'--'}}%</div></div></div>
    <div class="sc-i"><div><div class="sc-t">AI回复率</div><div class="sc-v text-gold">{{stats.reply_rate||'--'}}%</div></div></div>
  </div>
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
      <el-input v-model="kw" placeholder="搜索评价..." style="width:200px" size="small" clearable @clear="s" @keyup.enter="s"/>
      <el-select v-model="rating" placeholder="评分" style="width:90px" size="small" clearable @change="s"><el-option label="5★" value="5"/><el-option label="4★" value="4"/><el-option label="3★" value="3"/><el-option label="2★" value="2"/><el-option label="1★" value="1"/></el-select>
      <el-button size="small" type="primary" @click="load">刷新</el-button>
    </div>
    <el-table :data="items" stripe v-loading="loading">
      <el-table-column prop="store_name" label="门店" width="120"/>
      <el-table-column prop="user_name" label="顾客" width="80"/>
      <el-table-column prop="rating" label="评分" width="70"><template #def="s"><span :style="{color:s.row.rating>=4?'var(--green)':s.row.rating<=2?'var(--red)':'var(--gold)'}">{{s.row.rating}}分</span></template></el-table-column>
      <el-table-column prop="content" label="评价内容" min-width="240" show-overflow-tooltip/>
      <el-table-column prop="ai_reply" label="AI回复" min-width="140" show-overflow-tooltip/>
      <el-table-column label="操作" width="160"><template #def="s"><el-button link size="small" type="primary" @click="genReply(s.row)">AI生成</el-button><el-button link size="small" type="success" @click="syncReply(s.row)">同步</el-button></template></el-table-column>
    </el-table>
    <div style="margin-top:14px;text-align:right"><el-pagination background layout="prev,pager,next,total" :total="total" :page-size="size" v-model:current-page="page" @current-change="load"/></div>
  </div>
</div>`,
  setup(){
    const items=ref([]),loading=ref(false),total=ref(0),page=ref(1),size=ref(20),kw=ref(''),rating=ref('')
    const stats=reactive({total:0,good_rate:0,bad_rate:0,reply_rate:0})
    const load=async()=>{
      loading.value=true
      try{const r=await http.get('/reviews',{params:{page:page.value,size:size.value,keyword:kw.value,rating:rating.value}});items.value=r.items||[];total.value=r.total||0}catch(e){}
      loading.value=false
    }
    const s=()=>{page.value=1;load()}
    const genReply=async(row)=>{try{await http.post('/reviews/'+row.id+'/generate-reply');ElMessage.success('AI回复已生成');load()}catch(e){}}
    const syncReply=async(row)=>{try{await http.post('/reviews/'+row.id+'/sync');ElMessage.success('已同步')}catch(e){}}
    onMounted(async()=>{load();try{const s=await http.get('/reviews/stats');Object.assign(stats,s)}catch(e){}})
    return {items,loading,total,page,size,kw,rating,stats,load,s,genReply,syncReply}
  }
}

// ======================== 下属商户 ========================
const Merchants = {
  template:`
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div style="display:flex;gap:10px">
      <el-input v-model="kw" placeholder="搜索商户..." style="width:220px" size="small" clearable @clear="s" @keyup.enter="s"/>
      <el-select v-model="ind" placeholder="行业" style="width:140px" size="small" clearable @change="s"><el-option v-for="i in inds" :key="i" :label="i" :value="i"/></el-select>
    </div>
    <el-button size="small" type="primary" @click="load">刷新</el-button>
  </div>
  <el-table :data="items" stripe v-loading="loading" @row-click="detail">
    <el-table-column prop="name" label="商户名称" min-width="140"/><el-table-column prop="contact" label="联系人" width="90"/>
    <el-table-column prop="industry" label="行业" width="110"/>
    <el-table-column prop="org_name" label="归属机构" width="160"/>
    <el-table-column prop="status" label="状态" width="90"><template #def="s"><el-tag :type="s.row.status==='APPROVED'?'success':s.row.status==='SUBMITTED'?'warning':'info'" size="small">{{s.row.status==='APPROVED'?'已审核':s.row.status==='SUBMITTED'?'待审核':s.row.status}}</el-tag></template></el-table-column>
    <el-table-column prop="create_time" label="入驻时间" width="110"/>
  </el-table>
  <div style="margin-top:14px;text-align:right"><el-pagination background layout="prev,pager,next,total" :total="total" :page-size="size" v-model:current-page="page" @current-change="load"/></div>
  <el-dialog v-model="dv" title="商户详情" width="800px">
    <div v-if="detail"><el-descriptions :column="2" border size="small">
      <el-descriptions-item label="商户编号">{{detail.mno}}</el-descriptions-item>
      <el-descriptions-item label="商户简称">{{detail.name}}</el-descriptions-item>
      <el-descriptions-item label="联系人">{{detail.contact}}</el-descriptions-item>
      <el-descriptions-item label="行业">{{detail.industry}} / {{detail.category}}</el-descriptions-item>
      <el-descriptions-item label="归属机构" :span="2">{{detail.org_name}} / {{detail.salesman}}</el-descriptions-item>
      <el-descriptions-item label="微信子商户号">{{detail.wx_sub_mch_id}}</el-descriptions-item>
      <el-descriptions-item label="支付宝子商户号">{{detail.ali_sub_mch_id}}</el-descriptions-item>
    </el-descriptions></div>
  </el-dialog>
</div>`,
  setup(){
    const items=ref([]),loading=ref(false),total=ref(0),page=ref(1),size=ref(20),kw=ref(''),ind=ref(''),detail=ref(null),dv=ref(false)
    const inds=['餐饮','百货零售批发','商业生活服务','休闲娱乐','酒旅景区','医疗卫生','教育服务','交通出行','车主生活']
    const load=async()=>{loading.value=true;try{const r=await http.get('/merchants/',{params:{page:page.value,size:size.value,keyword:kw.value,industry:ind.value}});items.value=r.items||[];total.value=r.total||0}catch(e){};loading.value=false}
    const s=()=>{page.value=1;load()}
    const d=async(row)=>{try{const r=await http.get('/merchants/'+row.id);detail.value=r;dv.value=true}catch(e){}}
    onMounted(load)
    return {items,loading,total,page,size,kw,ind,detail,dv,inds,load,s,d}
  }
}

// ======================== 业务员管理 ========================
const Sales = {
  template:`
<div class="card">
  <div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3>业务员列表</h3><el-button size="small" type="primary" @click="load">刷新</el-button></div>
  <el-table :data="items" stripe v-loading="loading">
    <el-table-column prop="name" label="姓名" width="100"/><el-table-column prop="region" label="区域" width="120"/>
    <el-table-column prop="merchant_count" label="负责商户" width="100"/><el-table-column prop="performance" label="业绩" width="130"/>
    <el-table-column prop="status" label="状态" width="90"/>
    <el-table-column label="操作" width="160"><template #def="s"><el-button link size="small" @click="visits(s.row)">拜访记录</el-button><el-button link size="small" type="primary" @click="assign(s.row)">分配客户</el-button></template></el-table-column>
  </el-table>
  <div style="margin-top:14px;text-align:right"><el-pagination background layout="prev,pager,next,total" :total="total" :page-size="size" v-model:current-page="page" @current-change="load"/></div>
</div>`,
  setup(){
    const items=ref([]),loading=ref(false),total=ref(0),page=ref(1),size=ref(20)
    const load=async()=>{loading.value=true;try{const r=await http.get('/sales',{params:{page:page.value,size:size.value}});items.value=r.items||[];total.value=r.total||0}catch(e){};loading.value=false}
    const visits=(row)=>{ElMessage.info(row.name+'拜访记录')}
    const assign=(row)=>{ElMessage.info('分配客户给'+row.name)}
    onMounted(load)
    return {items,loading,total,page,size,load,visits,assign}
  }
}

    <el-table-column prop="points" label="积分" width="90"/><el-table-column prop="store_name" label="所属门店" min-width="130"/><el-table-column prop="total_spent" label="累计消费" width="120"><template #def="s">¥{{(s.row.total_spent||0).toLocaleString()}}</template></el-table-column>

// ======================== 佣金结算 ========================
const Commission = {
  template:`
<div>
  <div class="sc">
    <div class="sc-i"><div><div class="sc-t">本月佣金</div><div class="sc-v text-green">{{fmt(stats.monthly||0)}}</div><div class="sc-s">已结算{{fmt(stats.settled||0)}}</div></div></div>
    <div class="sc-i"><div><div class="sc-t">待结算</div><div class="sc-v text-gold">{{fmt(stats.pending||0)}}</div><div class="sc-s">{{stats.pending_count||0}}笔</div></div></div>
    <div class="sc-i"><div><div class="sc-t">累计佣金</div><div class="sc-v">{{fmt(stats.total||0)}}</div></div></div>
  </div>
  <div class="card">
    <h3>结算记录</h3>
    <el-table :data="items" stripe v-loading="loading">
      <el-table-column prop="period" label="结算周期" width="150"/>
      <el-table-column prop="amount" label="金额" width="130"><template #def="s">{{fmt(s.row.amount)}}</template></el-table-column>
      <el-table-column prop="merchant_count" label="涉及商户" width="90"/>
      <el-table-column prop="status" label="状态" width="90"><template #def="s"><el-tag :type="s.row.status==='SETTLED'?'success':'warning'" size="small">{{s.row.status==='SETTLED'?'已结算':'待结算'}}</el-tag></template></el-table-column>
      <el-table-column prop="settle_time" label="结算时间" width="160"/>
      <el-table-column label="操作" width="100"><template #def="s"><el-button v-if="s.row.status!=='SETTLED'" link size="small" type="primary" @click="settle(s.row)">结算</el-button></template></el-table-column>
    </el-table>
    <div style="margin-top:14px;text-align:right"><el-pagination background layout="prev,pager,next,total" :total="total" :page-size="size" v-model:current-page="page" @current-change="load"/></div>
  </div>
</div>`,
  setup(){
    const items=ref([]),loading=ref(false),total=ref(0),page=ref(1),size=ref(20)
    const stats=reactive({monthly:0,settled:0,pending:0,pending_count:0,total:0})
    const fmt=v=>v>=10000?'¥'+(v/10000).toFixed(2)+'万':'¥'+(v||0).toLocaleString()
    const load=async()=>{loading.value=true;try{const r=await http.get('/agents/settlements',{params:{page:page.value,size:size.value}});items.value=r.items||[];total.value=r.total||0}catch(e){};loading.value=false}
    const settle=async(row)=>{try{await http.post('/agents/settlements/'+row.id+'/settle');ElMessage.success('结算完成');load()}catch(e){}}
    onMounted(async()=>{load();try{const r=await http.get('/agents/commission');Object.assign(stats,r)}catch(e){}})
    return {items,loading,total,page,size,stats,fmt,load,settle}
  }
}

// ======================== 财务中心 ========================
const Finance = {
  template:`
<div>
  <div class="sc">
    <div class="sc-i"><div><div class="sc-t">总交易额</div><div class="sc-v">{{fmt(stats.total_amount||0)}}</div></div></div>
    <div class="sc-i"><div><div class="sc-t">退款</div><div class="sc-v text-red">{{fmt(stats.refund_amount||0)}}</div></div></div>
    <div class="sc-i"><div><div class="sc-t">待结算佣金</div><div class="sc-v text-gold">{{fmt(stats.commission||0)}}</div></div></div>
  </div>
  <el-tabs v-model="tab" @tab-change="loadTab">
    <el-tab-pane label="交易记录" name="transactions"><div class="card">
      <el-table :data="items" stripe><el-table-column prop="id" label="订单号" min-width="170"/><el-table-column prop="total_amount" label="金额" width="100"><template #def="s">¥{{(s.row.total_amount||0).toFixed(2)}}</template></el-table-column><el-table-column prop="status" label="状态" width="90"/><el-table-column prop="created_at" label="时间" width="160"/></el-table>
    </div></el-tab-pane>
    <el-tab-pane label="退款" name="refunds"><div class="card"><el-table :data="items" stripe><el-table-column prop="id" label="退款单号" min-width="160"/><el-table-column prop="amount" label="金额" width="100"/><el-table-column prop="status" label="状态" width="90"/></el-table></div></el-tab-pane>
  </el-tabs>
</div>`,
  setup(){
    const tab=ref('transactions'),items=ref([]),stats=reactive({total_amount:0,refund_amount:0,commission:0})
    const fmt=v=>v>=10000?'¥'+(v/10000).toFixed(1)+'万':'¥'+(v||0).toLocaleString()
    const loadTab=async()=>{
      const eps={transactions:'/finance/transactions',refunds:'/finance/refunds'}
      try{const r=await http.get(eps[tab.value],{params:{page:1,size:20}});items.value=r.items||[]}catch(e){}
    }
    onMounted(async()=>{loadTab();try{const s=await http.get('/finance/overview');Object.assign(stats,s)}catch(e){}})
    return {tab,items,stats,fmt,loadTab}
  }
}

// ======================== 路由 ========================
const routes = [
  {path:'/',redirect:'/dashboard'},
  {path:'/login',component:LoginPage},
  {path:'/',component:MainLayout,children:[
    {path:'dashboard',component:Dashboard},
    {path:'reviews',component:Reviews},
    {path:'merchants',component:Merchants},
    {path:'sales',component:Sales},
    {path:'members',component:Members},
    {path:'commission',component:Commission},
    {path:'finance',component:Finance},
  ]}
]

const router = createRouter({history:createWebHashHistory(),routes})
router.beforeEach((to,from)=>{if(to.path!=='/login'&&!_token)return'/login'})

const app = createApp({})
app.use(router);app.use(ElementPlus)
for(const [k,c] of Object.entries(ElementPlusIconsVue)){app.component(k,c)}
app.mount('#app')
</script>
</body>
