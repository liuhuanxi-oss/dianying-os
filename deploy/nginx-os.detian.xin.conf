# ============================================================
# 店赢OS - Nginx 生产配置
# 域名: os.detian.xin
# 后端: 127.0.0.1:8081 (dyos-server)
# 静态文件: /www/wwwroot/os.detian.xin/
# ============================================================

# 限流区域定义 - 在 http 块中添加（如果宝塔已全局定义则注释掉）
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name os.detian.xin;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name os.detian.xin;

    # SSL 证书（宝塔自动管理，路径以实际为准）
    ssl_certificate     /www/server/panel/vhost/cert/os.detian.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/os.detian.xin/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 禁止目录浏览
    autoindex off;

    # 日志
    access_log  /www/wwwlogs/os.detian.xin.access.log main buffer=32k flush=5s;
    error_log   /www/wwwlogs/os.detian.xin.error.log  warn;

    # 客户端请求体大小限制
    client_max_body_size 20m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ==================== 静态文件 ====================
    # 官网首页、admin-spa、admin-frontend
    root /www/wwwroot/os.detian.xin;
    index index.html;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==================== API 反向代理 ====================
    location /api/ {
        # 通用 API 限流: 30次/秒
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓冲
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         32 8k;
        proxy_busy_buffers_size 16k;

        # 隐藏后端标识
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # 登录接口单独限流: 5次/分钟
    location ~ ^/api/(login|auth/login) {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== WebSocket ====================
    location /ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # WebSocket 长连接 24h
        proxy_send_timeout 86400s;
    }

    # ==================== 健康检查（不限流） ====================
    location = /api/health {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ==================== 禁止访问隐藏文件 ====================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==================== 禁止直接访问备份文件 ====================
    location ~* \.(old|bak|backup|sql|tar|gz|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==================== 404 兜底 ====================
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# map 块（放在 http 层，宝塔通常在 nginx.conf 全局定义）
# 如果不存在则添加:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
# ============================================================
