# ============================================================
# 店赢OS - 日志轮转配置
# 文件路径: /etc/logrotate.d/dyos-server
# ============================================================

/www/wwwroot/os.detian.xin/logs/*.log {
    daily                    # 每日轮转
    rotate 30                # 保留30天
    missingok                # 日志文件不存在不报错
    notifempty               # 空文件不轮转
    compress                 # 压缩 (gzip)
    delaycompress            # 延迟一天压缩（保留最新一天可读）
    dateext                  # 日期后缀 YYYYMMDD
    dateformat -%Y%m%d
    sharedscripts            # 所有日志共用 postrotate
    postrotate
        # 通知进程重新打开日志文件
        /bin/kill -HUP $(cat /var/run/dyos-server.pid 2>/dev/null) 2>/dev/null || true
    endscript
    create 0640 www www      # 新建日志文件权限
    maxsize 100M             # 单文件超过100M强制轮转
    su www www               # 以www用户执行
}

# Nginx日志轮转（宝塔通常已配置，此为补充）
/www/wwwlogs/os.detian.xin.*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        /bin/kill -USR1 $(cat /var/run/nginx.pid 2>/dev/null) 2>/dev/null || true
    endscript
}
